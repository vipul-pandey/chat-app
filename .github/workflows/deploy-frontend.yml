name: Deploy frontend to S3
on:
  push:
    branches: [master]
    paths: ['frontend/**', 'package.json', 'package-lock.json', 'deploy/aws/publish-frontend.sh', '.github/workflows/deploy-frontend.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chat-app-frontend-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps --prefix frontend --no-audit --no-fund
      - run: npm run test:auth --prefix frontend
      - run: npm run build --prefix frontend
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::559947224926:role/chat-app-github-deploy
          aws-region: ap-south-1
      - run: bash deploy/aws/publish-frontend.sh
      - name: Verify website and API
        run: |
          curl --fail --silent --show-error --retry 5 https://d2suke8zow8xpc.cloudfront.net/ -o /tmp/chat-app-index.html
          grep -q '<div id="root"></div>' /tmp/chat-app-index.html
          curl --fail --silent --show-error --retry 5 https://d2suke8zow8xpc.cloudfront.net/api/health
